<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multi Redirect</title>
</head>
<body style="text-align:center;font-family:Arial">

  <h2>Redirecting in 5 seconds...</h2>

  <script>
    const links = [
      "https://example1.com",
      "https://example2.com",
      "https://example3.com",
      "https://example4.com",
      "https://example5.com" // last one will open in same tab
    ];

    setTimeout(() => {

      // Open first 4 links in new tabs
      for (let i = 0; i < 4; i++) {
        window.open(links[i], "_blank");
      }

      // Open 5th link in same tab
      window.location.href = links[4];

    }, 5000);
  </script>

</body>
</html>
